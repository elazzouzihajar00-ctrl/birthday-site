<!DOCTYPE html>
<html lang="en">
<head>

    <title>Choose Your Gift 🎁</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="gifts-page">

    <!-- Stars -->

    <div class="shooting-star shooting-1"></div>

    <div class="gifts-container">

            <button class="gift-box gift-one" onclick="openGift1()">

            <button class="gift-box gift-two" onclick="openGift2()">

            </button>

            <button class="gift-box gift-three" onclick="openGift3()">
                <span class="gift-lid">🎀</span>
                <span class="gift-emoji">🎁</span>
            </button>

        </div>

    </div>

    <script>

    function openGift1() {
        window.location.href = "gift1.html";
    }

    function openGift2() {
        window.location.href = "gift2.html";
    }
     function openGift3() {
        window.location.href = "gift3.html";
    }

</script>
