<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Song For You 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="song-page">

    <!-- ✨ Sparkles -->
    <div class="u-star s1">✦</div>
    <div class="u-star s2">✧</div>
    <div class="u-star s3">♡</div>
    <div class="u-star s4">✦</div>
    <div class="u-star s5">✧</div>
    <div class="u-star s6">♡</div>


    <!-- 🌠 Shooting stars -->
    <div class="shooting-star ss1"></div>
    <div class="shooting-star ss2"></div>


    <!-- 💗 MAIN CONTENT -->
    <div class="song-content">

        <h1>A Little Song For You 🎀</h1>


        <div class="song-row">


            <!-- 🐱 LEFT CAT -->
            <div class="song-cat left-cat">

                <img
                    src="images/cat-left.gif"
                    alt="Cute cat"
                >

                <div>♡</div>

            </div>



            <!-- 🎬 VIDEO -->
            <div class="music-box">

                <video
                    controls
                    class="birthday-video"
                >

                    <source
                        src="images/birthday-video.mp4"
                        type="video/mp4"
                    >

                    Your browser does not support video.

                </video>

            </div>



            <!-- 🐱 RIGHT CAT -->
            <div class="song-cat right-cat">

                <img
                    src="images/cat-right.gif"
                    alt="Cute cat"
                >

                <div>♡</div>

            </div>


        </div>



        <!-- 🎁 BACK BUTTON -->
        <button
            class="back-song"
            onclick="goBackToGifts()"
        >
            ← Back to gifts 🎁
        </button>


    </div>



    <script>

        function goBackToGifts() {

            window.location.href = "gifts.html";

        }

    </script>

</body>

</html>
