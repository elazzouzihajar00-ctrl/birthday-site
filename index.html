<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>This Is For You 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Moving clouds -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <!-- Sparkles -->
    <div class="sparkle sparkle-1">✦</div>
    <div class="sparkle sparkle-2">✧</div>
    <div class="sparkle sparkle-3">♡</div>
    <div class="sparkle sparkle-4">✦</div>

    <!-- Main content -->
    <div class="page">

        <!-- Chibi girl -->
        <img
            src="images/girl.png"
            alt="Cute birthday girl"
            class="girl"
        >

        <!-- Birthday message -->
        <div class="card">

            <div class="mini-heart">♡</div>

            <p class="intro">A little surprise for you...</p>

            <h1>This Is For You</h1>

            <p class="question">
                Do you want to see your gifts?
            </p>

            <div class="buttons">

                <button class="yes" onclick="goToGifts()">
                    YES 🎁
                </button>

                <button class="no" onclick="goToNo()">
                    NO 🥺
                </button>

            </div>

        </div>

    </div>

    <script>

        function goToGifts() {
            window.location.href = "gifts.html";
        }

        function goToNo() {
            window.location.href = "no.html";
        }

    </script>

</body>

</html>
